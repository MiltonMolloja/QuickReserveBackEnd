# ===========================================
# SonarQube Configuration for QuickReserve
# ===========================================

# Project identification
sonar.projectKey=quickreserve-backend
sonar.projectName=QuickReserve Backend API
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/obj/**,**/bin/**,**/Migrations/**,**/*.Designer.cs

# Test exclusions from coverage
sonar.coverage.exclusions=**/Program.cs,**/Startup.cs,**/*Configuration.cs,**/Migrations/**

# Language
sonar.language=cs

# Encoding
sonar.sourceEncoding=UTF-8

# .NET specific settings
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# Quality Gate
sonar.qualitygate.wait=true

# Branch analysis (for CI/CD)
# sonar.branch.name=${BRANCH_NAME}

# Server URL (when running locally with docker-compose)
sonar.host.url=http://localhost:9000

# Authentication token (set via environment variable SONAR_TOKEN)
# sonar.login=${SONAR_TOKEN}
