services:
  # ===========================================
  # QuickReserve API
  # ===========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickreserve-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Redis=redis:6379
      - TecnomApi__Username=${TECNOM_USERNAME}
      - TecnomApi__Password=${TECNOM_PASSWORD}
      - Cors__AllowedOrigins__0=${CORS_ORIGIN:-http://localhost:4200}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - quickreserve-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ===========================================
  # Redis - Caching
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: quickreserve-redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - quickreserve-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  quickreserve-network:
    driver: bridge

volumes:
  redis-data:
