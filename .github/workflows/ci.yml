# -----------------------------------------------------------------------
# QuickReserve Backend - CI Pipeline
# Build, Test, Coverage & SonarQube Analysis
# -----------------------------------------------------------------------

name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_QUALITY: "preview"
  SOLUTION_PATH: "QuickReserve.sln"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for SonarQube

      # ---------------------------------------------------------------
      # .NET SDK Setup (preview for .NET 10)
      # ---------------------------------------------------------------
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      # ---------------------------------------------------------------
      # Restore dependencies
      # ---------------------------------------------------------------
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # ---------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------
      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      # ---------------------------------------------------------------
      # Test with coverage
      # ---------------------------------------------------------------
      - name: Run tests with coverage
        run: |
          dotnet test ${{ env.SOLUTION_PATH }} \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      # ---------------------------------------------------------------
      # Upload coverage artifact
      # ---------------------------------------------------------------
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml
          retention-days: 5

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install Java 17 (required by SonarScanner)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: SonarQube Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          dotnet sonarscanner begin \
            /key:"quickreserve-backend" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release

      - name: Test with coverage
        run: |
          dotnet test ${{ env.SOLUTION_PATH }} \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --results-directory ./coverage

      - name: SonarQube End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Remove sonar-project.properties if exists (scanner v11 rejects it)
          rm -f sonar-project.properties
          dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t quickreserve-api:${{ github.sha }} \
            -t quickreserve-api:latest \
            .

      - name: Verify Docker image
        run: docker images quickreserve-api
